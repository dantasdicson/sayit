{% extends 'core/base_public.html' %}
{% block title %}{{ titulo }} | SayIt!{% endblock %}
{% block content %}
<section class="auth-card" aria-labelledby="auth-title">
  <p class="eyebrow">CUIDANDO DA SUA CONTA</p>
  <h1 id="auth-title">{{ titulo }}</h1>
  <p class="auth-subtitle">{{ descricao }}</p>
  {% block recovery_content %}{% endblock %}
  <p class="auth-alternative"><a href="{% url 'login' %}">Voltar para entrar</a></p>
</section>
{% endblock %}
