name: SayIt PostgreSQL
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sayit
          POSTGRES_USER: sayit
          POSTGRES_PASSWORD: senha-exclusiva-dos-testes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sayit -d sayit"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DEBUG: "true"
      SECRET_KEY: chave-ficticia-ci-exclusiva-dos-testes-com-mais-de-cinquenta-caracteres
      DATABASE_URL: postgresql://sayit:senha-exclusiva-dos-testes@127.0.0.1:5432/sayit
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test --noinput
      - run: node --test core/static/core/tests/*.test.cjs
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check --deploy --fail-level ERROR
        env:
          DEBUG: "false"
          TRUST_PROXY_SSL_HEADER: "true"
      - run: node build.mjs
        working-directory: deploy/vercel
        env:
          RENDER_ORIGIN: https://sayit-ci.onrender.com
